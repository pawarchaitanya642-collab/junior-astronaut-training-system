<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101525">
  <meta name="description" content="Orbit Academy pairs hands-on astronaut training simulations with an interactive explorer for open NASA Earth event data.">
  <title>Orbit Academy — Space Science Learning Lab</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app"></div>
  <dialog id="mission-dialog" class="mission-dialog" aria-labelledby="game-title"><div id="game-shell"></div></dialog>
  <dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title"><div id="info-content"></div></dialog>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <noscript><div class="noscript">Orbit Academy needs JavaScript to run its flight simulators. Please enable it and reload.</div></noscript>
</body>
</html>
